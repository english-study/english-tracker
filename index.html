<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Progress Tracker</title>
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1f2a27; --muted:#6b7773; --line:#e4e0d4;
  --accent:#2f5d50; --accent-soft:#dcebe5; --warn:#c8742b; --warn-soft:#f8e8d6; --ok:#2f7d4f; --bad:#b3382c; --bad-soft:#f6dfdb;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141a18; --card:#1d2523; --ink:#eef1ee; --muted:#9aa7a2; --line:#2c3633;
    --accent:#6fbf9f; --accent-soft:#25382f; --warn:#e39a55; --warn-soft:#3a2d1f; --ok:#6fcf93; --bad:#ee8a7e; --bad-soft:#3d2623; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.95rem}
.count{background:var(--accent);color:#fff;border-radius:16px;padding:14px 20px;text-align:center;min-width:150px}
.count b{display:block;font-size:2.2rem;line-height:1.1}
.count span{font-size:.85rem;opacity:.9}
@media (prefers-color-scheme: dark){ .count{color:#10201a} }
.banner{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h2{margin:0 0 10px;font-size:1rem}
.stat b{font-size:1.9rem;display:block;line-height:1.15}
.stat span{color:var(--muted);font-size:.88rem}
.bar{height:12px;background:var(--accent-soft);border-radius:99px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.big .bar{height:18px}
.marker{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;margin:12px 0 5px}
.row small{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:.92rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme: dark){ .tabs button[aria-selected="true"]{color:#10201a} }
.empty{color:var(--muted);padding:10px 0}
.top{display:flex;gap:8px;align-items:center}
.top button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chart{width:100%;height:180px}
.good{color:var(--ok)}

/* homework */
.hw h3{margin:22px 0 4px;font-size:1.05rem}
.hw h3:first-of-type{margin-top:6px}
.hw .intro{color:var(--muted);font-size:.92rem;margin:0 0 12px}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q p{margin:0 0 8px}
.opt{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:4px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=text]{max-width:260px;display:inline-block}
textarea{min-height:150px;resize:vertical}
.gap{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hint{color:var(--muted);font-size:.85rem}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;border-radius:12px;padding:12px 20px;cursor:pointer}
@media (prefers-color-scheme: dark){ .btn{color:#10201a} }
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{padding:8px 14px;font-size:.92rem}
.wb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.wb span{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:.85rem}
.wb span.used{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){ .wb span.used{color:#10201a} }
.fb{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:.9rem}
.fb.ok{background:var(--accent-soft)}
.fb.no{background:var(--bad-soft)}
.err{color:var(--bad);margin:10px 0 0;font-size:.92rem}
.result{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.list{display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.item .t{min-width:0}

/* word cards */
.folders{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.folder{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:16px;cursor:pointer;font:inherit}
.folder:hover{border-color:var(--accent)}
.folder b{display:block;font-size:1.05rem}
.folder .hint{margin-top:2px}
.folder .bar{height:8px;margin-top:10px}
.deckbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stage{perspective:1200px}
.flip{position:relative;width:100%;min-height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s;border-radius:20px;outline-offset:3px}
.flip.on{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){ .flip{transition:none} }
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border-radius:20px;border:1px solid var(--line)}
.face.front{background:var(--accent-soft)}
.face.front .w{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.face .w,.face .m,.face .e{white-space:pre-line};font-weight:700;letter-spacing:-.01em}
.face.back{background:var(--card);transform:rotateY(180deg)}
.face.back .m{font-size:1.5rem;font-weight:600}
.face.back .e{margin-top:12px;color:var(--muted);font-style:italic}
.face .tap{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.controls{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.qlist{counter-reset:q;display:grid;gap:8px}
.qrow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card)}
.qrow .n{color:var(--muted);min-width:1.6em}
</style>
</head>

/* ================= helpers ================= */
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function toObjects(rows){
  if(!rows.length) return [];
  const h=rows[0].map(s=>s.trim());
  return rows.slice(1).filter(r=>r.some(c=>c.trim()!=="")).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||"").trim());return o;});
}
function parseDate(s){
  if(!s) return null; s=s.trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/))) return new Date(+m[3],+m[2]-1,+m[1]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return new Date(+m[3],+m[1]-1,+m[2]);
  const d=new Date(s); return isNaN(d)?null:d;
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const n=parseFloat(String(s).replace(",",".")); return isNaN(n)?null:n;};
const fmtDate=d=>d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
const $=id=>document.getElementById(id);
const isYes=v=>/^(yes|y|так|\+|1|true)$/i.test(String(v||"").trim());
const norm=s=>String(s||"").toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," ").trim();
const countWords=t=>{const m=String(t||"").trim().match(/\S+/g);return m?m.length:0;};
const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};

/* ================= load from the sheet ================= */
// tab name -> a header that must exist (Google returns the FIRST tab when a name is missing, so we check)
const TABS={
  "Settings":"Setting","Lessons":"Date","Words":"Word / phrase","Mistakes":"Correct version","Mock":"Test",
  "Homework":"Title","Homework questions":"Option A","Speaking questions":"Topic",
  "Submissions":"Part 3 text","Answers":"His answer"
};
async function loadTab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error(name+": HTTP "+r.status);
  const t=await r.text();
  if(t.trim().startsWith("<")) throw new Error(name+": sheet is not shared with 'Anyone with the link'");
  const rows=parseCSV(t);
  if(!rows.length||!rows[0].map(s=>s.trim()).includes(TABS[name])) return [];   // tab missing or wrong tab
  return toObjects(rows);
}
async function loadAll(){
  if(!SHEET_ID) return JSON.parse(JSON.stringify(STARTER));
  const names=Object.keys(TABS);
  const res=await Promise.all(names.map(n=>loadTab(n).catch(e=>{ if(["Settings","Lessons","Words"].includes(n)) throw e; return []; })));
  const data={}; names.forEach((n,i)=>data[n]=res[i]);
  return data;
}

/* ================= build homework from sheet rows ================= */
function buildHomeworks(data){
  const items=data["Homework questions"]||[];
  return (data["Homework"]||[]).filter(h=>h.ID&&isYes(h["Published (yes/no)"])).map(h=>{
    const rows=items.filter(r=>r.Homework===h.ID);
    const part=p=>rows.filter(r=>String(r.Part).trim()===String(p)).sort((a,b)=>num(a["#"])-num(b["#"]));
    const ex1=part(1).map(r=>{
      const opts=[r["Option A"],r["Option B"],r["Option C"]];
      const whys=[r["Why A"],r["Why B"],r["Why C"]];
      const keep=opts.map((o,i)=>o?i:-1).filter(i=>i>=0);
      const a=keep.indexOf("ABC".indexOf((r.Correct||"A").trim().toUpperCase()[0]));
      return {q:r.Question,opts:keep.map(i=>opts[i]),why:keep.map(i=>whys[i]||""),a:Math.max(0,a)};
    });
    const ex2=part(2).map(r=>{
      const k=r.Question.indexOf("___");
      return {pre:k<0?r.Question+" ":r.Question.slice(0,k),post:k<0?"":r.Question.slice(k+3),
        ans:String(r.Correct||"").split("|").map(s=>s.trim()).filter(Boolean),hint:r.Hint||""};
    });
    const p3=part(3)[0];
    const ex3=p3?{q:p3.Question,instr:p3.Hint||"",bank:String(p3["Option A"]||"").split("|").map(s=>s.trim()).filter(Boolean),minWords:num(p3.Correct)||40}:null;
    return {id:h.ID,lesson:h.Lesson,title:h.Title,intro:h.Intro||"",ex1,ex2,ex3};
  });
}

/* ================= results (from the sheet, with a local fallback) ================= */
function sheetResult(id){
  const subs=(STATE.raw.Submissions||[]).filter(r=>r.Homework===id);
  if(!subs.length) return null;
  const last=subs[subs.length-1];
  const all=(STATE.raw.Answers||[]).filter(r=>r.Homework===id);
  const ts=all.length?all[all.length-1].Timestamp:null;
  const det=all.filter(r=>r.Timestamp===ts).map(r=>({
    part:String(r.Part).trim(),n:num(r["#"]),question:r.Question,his:r["His answer"],correct:r["Correct answer"],
    ok:/^ok$/i.test(r.Result),why:r["Why his answer is wrong"]||"",rule:r["Why the correct answer is right"]||""}));
  return {id,details:det,text:last["Part 3 text"]||"",used:last["Part 3 words from bank"]||"",scoreText:[last["Part 1 score"],last["Part 2 score"]],from:"sheet"};
}
function localResult(id){ try{ const s=store.get("hw_"+id); return s?JSON.parse(s):null; }catch(e){return null;} }
function resultFor(id){ return sheetResult(id)||localResult(id); }

/* ================= compute ================= */
const SKILLS=[["Grammar (1-5)","Grammar"],["Vocabulary (1-5)","Vocabulary"],["Speaking (1-5)","Speaking"],["Pronunciation (1-5)","Pronunciation"]];
let STATE=null, ACTIVE="lessons";

function compute(data){
  const S={}; (data.Settings||[]).forEach(r=>S[r.Setting]=r.Value);
  const cfg={
    name:(S["Student name"]||"").trim(), testDate:parseDate(S["Test date"]), goal:S["Goal"]||"Strong B1",
    totalLessons:num(S["Total lessons planned"])||12, wordsGoal:num(S["Words goal"])||150, target:num(S["Target skill rating (1-5)"])||4
  };
  const lessons=(data.Lessons||[]).filter(r=>r["Date"]||r["Topic (what you actually did)"]||r.Status);
  const done=lessons.filter(r=>/^done$/i.test(r.Status));
  const latest={};
  SKILLS.forEach(([col])=>{ for(let i=lessons.length-1;i>=0;i--){ const v=num(lessons[i][col]); if(v!==null){latest[col]=v;break;} } });
  const words=(data.Words||[]).filter(r=>r["Word / phrase"]);
  const learned=words.filter(r=>isYes(r["Learned? (yes/no)"]));
  const mistakes=(data.Mistakes||[]).filter(r=>r["Mistake (what he said)"]);
  const open=mistakes.filter(r=>!/fixed/i.test(r.Status));
  const mocks=(data.Mock||[]).filter(r=>r.Test||r.Date).map(r=>{
    let tot=num(r["Total %"]);
    if(tot===null){ const v=["Grammar %","Vocabulary %","Speaking %"].map(k=>num(r[k])).filter(x=>x!==null); if(v.length) tot=v.reduce((a,b)=>a+b,0)/v.length; }
    return {...r,total:tot};
  });
  const homeworks=buildHomeworks(data);
  const parts=[];
  SKILLS.forEach(([col])=>{ if(latest[col]!==undefined) parts.push(Math.min(1,latest[col]/cfg.target)); });
  parts.push(Math.min(1,learned.length/cfg.wordsGoal));
  const overall=Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
  const speaking=(data["Speaking questions"]||[]).filter(r=>r.Question);
  return {cfg,lessons,done,latest,words,learned,mistakes,open,mocks,homeworks,speaking,overall};
}
function hwDoneCount(){ return STATE.homeworks.filter(h=>resultFor(h.id)).length; }

/* ================= word cards ================= */
let DECK={list:[],i:0,on:false};
function lessonGroups(){
  const g={};
  STATE.words.forEach(w=>{ const k=(w["Lesson #"]||"").trim()||"0"; (g[k]=g[k]||[]).push(w); });
  return Object.keys(g).sort((a,b)=>num(a)-num(b)).map(k=>({key:k,words:g[k]}));
}
function lessonTitle(k){
  const l=STATE.lessons.find(r=>String(r["#"]).trim()===k);
  return l&&l["Topic (what you actually did)"]?l["Topic (what you actually did)"]:"";
}
function renderFolders(){
  const p=$("panel"); setMode("folders");
  const groups=lessonGroups();
  if(!groups.length){ p.innerHTML='<div class="empty">No words yet. They will appear here after each lesson.</div>'; return; }
  p.innerHTML='<p class="hint" style="margin:0 0 12px">Open a lesson, tap a card to flip it.</p><div class="folders">'+groups.map(g=>{
    const n=g.words.length, L=g.words.filter(w=>isYes(w["Learned? (yes/no)"])).length;
    const name=g.key==="0"?"Other words":"Lesson "+g.key;
    return `<button class="folder" type="button" data-k="${esc(g.key)}"><b>📁 ${esc(name)}</b><div class="hint">${esc(lessonTitle(g.key))}</div><div class="hint">${n} words · ${L} learned</div><div class="bar"><i style="width:${n?L/n*100:0}%"></i></div></button>`;
  }).join("")+'</div>';
  p.querySelectorAll(".folder").forEach(b=>b.addEventListener("click",()=>openDeck(b.dataset.k)));
}
function openDeck(k){
  const g=lessonGroups().find(x=>x.key===k); if(!g) return;
  DECK={list:g.words.slice(),i:0,on:false,key:k}; setMode("deck"); renderDeck();
}
function renderDeck(){
  const p=$("panel"), w=DECK.list[DECK.i]; if(!w) return;
  const L=isYes(w["Learned? (yes/no)"]);
  p.innerHTML=`<div class="deckbar"><button class="btn ghost small" id="dback" type="button">← Lessons</button>
    <b>${DECK.key==="0"?"Other words":"Lesson "+esc(DECK.key)}</b><span class="hint">${DECK.i+1} / ${DECK.list.length}</span></div>
  <div class="stage"><div class="flip ${DECK.on?"on":""}" id="flip" role="button" tabindex="0" aria-label="Word card. Press to flip.">
    <div class="face front"><div class="w">${esc(w["Word / phrase"])}</div><div class="tap">tap to flip</div></div>
    <div class="face back"><div class="m">${esc(w["Meaning / translation"])}</div><div class="e">${esc(w["Example sentence"])}</div>
      <div style="margin-top:12px"><span class="pill ${L?"":"warn"}">${L?"learned":"to learn"}</span></div><div class="tap">tap to flip back</div></div>
  </div></div>
  <div class="controls"><button class="btn ghost" id="prev" type="button">← Previous</button><button class="btn" id="flipb" type="button">Flip</button><button class="btn ghost" id="next" type="button">Next →</button><button class="btn ghost" id="shuf" type="button">Shuffle</button></div>`;
  $("dback").addEventListener("click",()=>{setMode("");renderFolders();});
  $("flip").addEventListener("click",()=>flipCard()); $("flipb").addEventListener("click",()=>flipCard());
  $("prev").addEventListener("click",()=>stepDeck(-1)); $("next").addEventListener("click",()=>stepDeck(1));
  $("shuf").addEventListener("click",()=>{ for(let i=DECK.list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[DECK.list[i],DECK.list[j]]=[DECK.list[j],DECK.list[i]];} DECK.i=0;DECK.on=false;renderDeck(); });
}
function flipCard(){ DECK.on=!DECK.on; const f=$("flip"); if(f) f.classList.toggle("on",DECK.on); }
function stepDeck(d){ DECK.i=(DECK.i+d+DECK.list.length)%DECK.list.length; DECK.on=false; renderDeck(); }
document.addEventListener("keydown",e=>{
  if($("panel").dataset.mode!=="deck"||/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||"")) return;
  if(e.key==="ArrowRight") stepDeck(1); else if(e.key==="ArrowLeft") stepDeck(-1);
  else if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flipCard(); }
});

/* ================= homework ================= */
function renderHomeworkList(){
  const p=$("panel"); setMode("hwlist");

      <button class="btn small ${done?"ghost":""}" data-open="${esc(h.id)}" type="button">${done?"View result":"Start"}</button></div>`;
  }).join("")+'</div>';

function wordsUsedIn(text,bank){ const t=norm(text); return (bank||[]).filter(w=>t.includes(norm(w))); }
function wireBack(){ const b=$("back"); if(b) b.addEventListener("click",()=>{setMode("");renderPanel();}); }

function openHomework(id){
  const hw=STATE.homeworks.find(x=>x.id===id); const p=$("panel"); if(!hw) return;
  const res=resultFor(id);
  if(res){ setMode("hwresult"); p.innerHTML=resultHTML(hw,res); wireBack(); return; }
  setMode("hwform");
  let h=`<div class="hw"><button class="btn ghost small" type="button" id="back" style="margin-bottom:10px">← Back</button>
  <h2 style="font-size:1.2rem;margin:4px 0">${esc(hw.title)}</h2><p class="intro">${esc(hw.intro)}</p>`;
  if(hw.ex1.length){
    h+=`<h3>Part 1. Choose the correct answer</h3>`;
    hw.ex1.forEach((q,i)=>{ h+=`<div class="q"><p><b>${i+1}.</b> ${esc(q.q)}</p>`+q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="e1_${i}" value="${j}"> ${esc(o)}</label>`).join("")+`</div>`; });
  }
  if(hw.ex2.length){
    h+=`<h3>Part 2. Fill in the gap</h3><p class="intro">Write one answer in each gap. The hint helps you.</p>`;
    hw.ex2.forEach((q,i)=>{ h+=`<div class="q"><div class="gap"><b>${i+1}.</b> <span>${esc(q.pre)}</span><input type="text" id="e2_${i}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap ${i+1}"><span>${esc(q.post)}</span></div><div class="hint">Hint: ${esc(q.hint)}</div></div>`; });
  }
  if(hw.ex3){
    h+=`<h3>Part 3. Write</h3><p><b>${esc(hw.ex3.q)}</b></p><p class="intro">${esc(hw.ex3.instr)}</p>
    <div class="wb" id="wb">${hw.ex3.bank.map(w=>`<span data-w="${esc(w)}">${esc(w)}</span>`).join("")}</div>
    <textarea id="e3" placeholder="Write here…"></textarea><div class="hint" id="wc">0 words · 0 expressions from the box used</div>`;
  }
  h+=`<div class="err" id="err" role="alert"></div><div style="margin-top:14px"><button class="btn" id="submit" type="button">Submit homework</button></div></div>`;
  p.innerHTML=h; wireBack();
  const ta=$("e3");
  if(ta) ta.addEventListener("input",()=>{
    const used=wordsUsedIn(ta.value,hw.ex3.bank);
    $("wc").textContent=countWords(ta.value)+" words · "+used.length+" expressions from the box used";
    document.querySelectorAll("#wb span").forEach(sp=>sp.classList.toggle("used",used.includes(sp.dataset.w)));
  });
  $("submit").addEventListener("click",()=>submitHomework(hw));
}

function submitHomework(hw){
  const err=$("err"); err.textContent="";
  const a1=hw.ex1.map((q,i)=>{const r=document.querySelector(`input[name="e1_${i}"]:checked`);return r?+r.value:null;});
  if(a1.some(v=>v===null)){ err.textContent="Please answer all the questions in Part 1."; return; }
  const text=hw.ex3?$("e3").value:"";
  if(hw.ex3&&countWords(text)<hw.ex3.minWords){ err.textContent=`Part 3: please write at least ${hw.ex3.minWords} words (you have ${countWords(text)}).`; return; }
  const details=[];
  hw.ex1.forEach((q,i)=>{ const ok=a1[i]===q.a; details.push({part:"1",n:i+1,question:q.q,his:q.opts[a1[i]],correct:q.opts[q.a],ok,why:ok?"":q.why[a1[i]],rule:q.why[q.a]}); });
  hw.ex2.forEach((q,i)=>{ const v=$("e2_"+i).value.trim(); const ok=q.ans.map(norm).includes(norm(v)); details.push({part:"2",n:i+1,question:q.pre+"___"+q.post,his:v||"(empty)",correct:q.ans[0],ok,why:"",rule:""}); });
  const used=hw.ex3?wordsUsedIn(text,hw.ex3.bank):[];
  const res={id:hw.id,details,text,used:used.length+": "+used.join(", "),from:"local",sent:null};
  const btn=$("submit"); btn.disabled=true; btn.textContent="Sending…";
  sendToSheet(hw,res).then(sent=>{
    res.sent=sent; store.set("hw_"+hw.id,JSON.stringify(res));
    setMode("hwresult"); $("panel").innerHTML=resultHTML(hw,res); wireBack(); renderTop();
    window.scrollTo({top:$("panel").offsetTop-10,behavior:"smooth"});
  });
}
const score=(d,part)=>{const x=d.filter(r=>r.part===part);return [x.filter(r=>r.ok).length,x.length];};
async function sendToSheet(hw,res){
  if(!SCRIPT_URL) return false;
  const [s1,t1]=score(res.details,"1"),[s2,t2]=score(res.details,"2");
  const payload={homework:hw.id,lesson:hw.lesson,part1:`${s1} of ${t1}`,part2:`${s2} of ${t2}`,wordsUsed:res.used,writing:res.text,answers1:"see Answers tab",answers2:"see Answers tab",details:res.details};
  try{ await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}); return true; }
  catch(e){ return false; }
}
function resultHTML(hw,res){
  const d=res.details||[];
  const [s1,t1]=score(d,"1"),[s2,t2]=score(d,"2");
  let h=`<div class="hw"><button class="btn ghost small" type="button" id="back" style="margin-bottom:10px">← Back</button>
  <div class="result"><b>${esc(hw.title)}</b><br>`;
  if(d.length) h+=`Part 1: <b>${s1} / ${t1}</b> · Part 2: <b>${s2} / ${t2}</b> · Writing: <b>${countWords(res.text)} words</b>`;
  else h+=`Part 1: <b>${esc((res.scoreText||[])[0]||"")}</b> · Part 2: <b>${esc((res.scoreText||[])[1]||"")}</b> · Writing: <b>${countWords(res.text)} words</b>`;
  if(res.from==="local") h+=`<br><span class="hint">${res.sent?"Sent to your teacher.":"Checked on this device. Saving to the teacher's sheet is not connected yet."}</span>`;
  h+=`</div>`;
  const p1=d.filter(r=>r.part==="1"), p2=d.filter(r=>r.part==="2");
  if(p1.length){
    h+=`<h3>Part 1: why each answer is right or wrong</h3>`;
    p1.forEach(r=>{ h+=`<div class="q"><p><b>${r.n}.</b> ${esc(r.question)}</p><div class="fb ${r.ok?"ok":"no"}">${r.ok
      ?"✓ <b>"+esc(r.his)+"</b>. "+esc(r.rule)
      :"✗ You chose <b>"+esc(r.his)+"</b>: "+esc(r.why)+"<br>✓ Correct: <b>"+esc(r.correct)+"</b>. "+esc(r.rule)}</div></div>`; });
  }
  if(p2.length){
    h+=`<h3>Part 2: gaps</h3>`;
    p2.forEach(r=>{ h+=`<div class="q"><p><b>${r.n}.</b> ${esc(r.question).replace("___","<b>"+esc(r.his)+"</b>")}</p><div class="fb ${r.ok?"ok":"no"}">${r.ok?"✓ Correct.":"✗ Correct answer: <b>"+esc(r.correct)+"</b>"}</div></div>`; });
  }
  h+=`<h3>Part 3: your text</h3><div class="q"><p style="white-space:pre-wrap">${esc(res.text)}</p><div class="hint">Your teacher will give feedback on this part in the next lesson.</div></div></div>`;
  return h;
}

/* ================= wiring ================= */
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  ACTIVE=b.dataset.tab; setMode("");
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  renderPanel();
}));
async function init(){
  $("subtitle").textContent="Loading…";
  try{
    const data=await loadAll();
    STATE=compute(data); STATE.raw=data; renderTop(); renderPanel();
  }catch(e){
    $("subtitle").textContent="Could not load the sheet";
    $("banner").innerHTML='<div class="banner"><b>Could not load data.</b> Check that the Google Sheet is shared as "Anyone with the link can view", that the sheet ID is correct, and that the tab names have not been changed.<br><small>'+esc(e.message)+'</small></div>';
  }
}
$("refresh").addEventListener("click",init);
init();
</script>
